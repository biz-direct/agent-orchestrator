# .github/workflows/sync-upstream-gate.yml
name: Sync upstream gate

# FORK ONLY: notification for the draft PRs opened by sync-upstream.yml. Sync PRs
# are never merged automatically (the user merges after triage; see docs/fork-ci.md),
# so the old merge gate is gone. What remains: when the Pullfrog pass that triages or
# resolves a sync fails, open an `agent-review` issue so it is not silent.

on:
  workflow_run:
    workflows:
      - Pullfrog
    types: [completed]

permissions:
  contents: read

jobs:
  pullfrog-failed:
    name: sync-gate-failure
    # Pullfrog could not prepare a conflicted sync (dispatched by sync-upstream.yml).
    if: >-
      github.repository != 'OrchestratorInc/agent-orchestrator'
      && github.event_name == 'workflow_run'
      && github.event.workflow_run.name == 'Pullfrog'
      && github.event.workflow_run.conclusion != 'success'
      && github.event.workflow_run.conclusion != 'skipped'
      && startsWith(github.event.workflow_run.display_title, 'Sync upstream')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      RUN_TITLE: ${{ github.event.workflow_run.display_title }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Open agent-review issue
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/agent-review-issue.sh open \
            "Upstream sync needs review: $RUN_TITLE" \
            "Pullfrog did not finish preparing the upstream sync ($RUN_CONCLUSION): $RUN_URL

          Resolve the merge by hand, or re-run the Sync upstream workflow."
