# .github/workflows/fork-release.yml
name: Fork release

# FORK ONLY: build the unsigned Apple Silicon macOS and Linux x64 desktop apps
# (via build-artifacts.yml) and attach them, sha256 digests and the updater
# feed files (latest-mac.yml / latest-linux.yml) to a GitHub Release on this repo.
# Replaces the external release conductor.
#
# Three entry points:
#   - FORK_VERSION: a push to main that changes the FORK_VERSION file releases
#     the version it contains (skipped quietly if that release already exists).
#   - workflow_dispatch (Actions tab): enter a version; the workflow creates
#     tag v<version> at the chosen ref together with the Release.
#   - pushing a v* tag by hand.
# No double run: the tag the dispatch path creates is made with the workflow's
# GITHUB_TOKEN, and events caused by GITHUB_TOKEN never trigger other workflows.

on:
  push:
    branches: [main]
    paths: [FORK_VERSION]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, semver without leading v (e.g. 1.2.3)"
        type: string
        required: true
      ref:
        description: "Branch, tag or SHA to build"
        type: string
        default: main
      prerelease:
        description: "Mark as prerelease (not offered by the stable updater channel)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      create_tag: ${{ steps.meta.outputs.create_tag }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate version, ref and that the release does not exist
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          skip=false
          from_file=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            create_tag=true
            prerelease="$INPUT_PRERELEASE"
          elif [ "$REF_TYPE" = "branch" ]; then
            # FORK_VERSION push to main.
            from_file=true
            version="$(tr -d '[:space:]' < FORK_VERSION)"
            version="${version#v}"
            create_tag=true
            prerelease=false
          else
            version="${REF_NAME#v}"
            create_tag=false
            prerelease=false
          fi
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?$"
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a valid semver version (expected e.g. 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi
          # A pre-release version can never be the stable "latest".
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$from_file" = true ]; then
              echo "Release $tag already exists; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release $tag already exists."
            exit 1
          fi
          if [ "$create_tag" = true ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$prerelease"
            echo "create_tag=$create_tag"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # scripts/feed.mjs needs app-builder-lib (blockmap/hash helpers).
      - name: Install feed tooling
        working-directory: frontend
        run: npm ci --ignore-scripts
      # Not `assets/`: that name collides with the repo's own assets/ directory.
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: "{mac-arm64,linux}"
          merge-multiple: true
      - name: Version file names, generate updater feeds and digests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd release-dist
          # feed.mjs only selects installers whose name contains the version.
          mv agent-orchestrator-darwin-arm64.zip "agent-orchestrator-$VERSION-darwin-arm64.zip"
          mv agent-orchestrator-linux-x64.AppImage "agent-orchestrator-$VERSION-linux-x64.AppImage"
          node ../frontend/scripts/feed.mjs . "$VERSION" latest
          # Both feeds must exist or the in-app updater has nothing to read.
          test -s latest-mac.yml && test -s latest-linux.yml
          # Blockmap sidecars are not published (see frontend/scripts/feed.mjs).
          rm -f ./*.blockmap
          sha256sum agent-orchestrator-* > SHA256SUMS.txt
          jq -Rn '[inputs | split("  ") | {(.[1]): .[0]}] | add' SHA256SUMS.txt > digests.json
          ls -l
          { echo '### Release assets'; echo '```'; cat SHA256SUMS.txt latest-mac.yml latest-linux.yml; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes)
          if [ "$CREATE_TAG" = true ]; then args+=(--target "$SHA"); else args+=(--verify-tag); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          # Explicit asset list: nothing else in release-dist may be published.
          gh release create "$TAG" \
            "release-dist/agent-orchestrator-$VERSION-darwin-arm64.zip" \
            "release-dist/agent-orchestrator-$VERSION-linux-x64.AppImage" \
            release-dist/latest-mac.yml \
            release-dist/latest-linux.yml \
            release-dist/digests.json \
            release-dist/SHA256SUMS.txt \
            "${args[@]}"
