# .github/workflows/sync-gate-tests.yml
name: sync-gate tests

# Lint the upstream-sync scripts.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/sync-upstream.yml"
      - ".github/workflows/sync-upstream-gate.yml"
      - ".github/workflows/sync-gate-tests.yml"

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
