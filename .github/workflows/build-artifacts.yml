# .github/workflows/build-artifacts.yml
name: Desktop build artifacts

# Dispatchable/callable unsigned desktop build. FORK: only Apple Silicon macOS
# and Linux x64 (AppImage) are built; fork-release.yml calls this on v* tags.
# Builds the Electron app for both platforms at a pinned ref with a
# caller-supplied version, uploads each installer as a short-lived run
# artifact, and emits a digests.json artifact (a flat JSON object mapping
# each artifact filename to its sha256 hex string) that the conductor reads
# to verify hashes before signing. Creates no release.
# macOS signing is OPTIONAL (FORK): when the caller passes the full set of
# Apple secrets (see docs/macos-signing.md), the mac job imports the Developer ID
# certificate via .github/actions/macos-signing-setup, forge signs + notarizes +
# staples, and the verify step fails the build if Gatekeeper would reject it.
# With no Apple secrets the build stays UNSIGNED with a warning; with only some
# of them it fails (a half-configured release must not ship unsigned silently).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        type: string
        required: true
      version:
        description: "Version string to stamp into the app"
        type: string
        required: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

env:
  VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `artifact` is the pinned upload-artifact name the downstream release
          # conductor consumes; the contained filenames keep the existing stable
          # alias names so the cask/updater/landing stay compatible. Do not
          # rename either without updating the conductor.
          - os: macos-latest
            platform: darwin-arm64
            artifact: mac-arm64
          # Linux tmux links glibc dynamically (#4616). Build on the oldest
          # supported glibc baseline so the bundle also runs on Ubuntu 22.04.
          - os: ubuntu-22.04
            platform: linux-x64
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      # The daemon is compiled by build-daemon.mjs during premake, so the Go
      # toolchain must be present and pinned on every runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui
      - name: Verify WorkOS build configuration
        shell: bash
        run: |
          if [ -z "$VITE_WORKOS_CLIENT_ID" ]; then
            echo "::error::Repository variable VITE_WORKOS_CLIENT_ID is required for desktop artifacts." >&2
            exit 1
          fi
      # Stamp the conductor-supplied version into package.json for this build,
      # dropping any +build metadata and a leading v.
      - name: Stamp version
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          node -e "const v=process.env.BUILD_VERSION.split('+')[0].replace(/^v/,''); const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      # Electron 44's V8 headers put [[deprecated]] before __attribute__ in a
      # class head, which Ubuntu 22.04's GCC 11 rejects when node-gyp rebuilds
      # better-sqlite3, and need std::source_location, which 22.04's libstdc++
      # offers only to a compiler with __builtin_source_location (clang 15+;
      # the runner's default clang is 14). Only C++ changes, so tmux and every
      # C build keep GCC, and the 22.04 libstdc++ and glibc baseline stays.
      - name: Use clang++-15 for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v clang++-15
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
      - name: Detect macOS signing configuration
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          set_count=0
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -n "${!name}" ]; then set_count=$((set_count + 1)); else missing+=("$name"); fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "::warning::macOS signing secrets are not configured; building an UNSIGNED app. Gatekeeper will report it as damaged and in-app auto-update will not work. See docs/macos-signing.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::macOS signing is partially configured; missing: ${missing[*]}. Set all six secrets (docs/macos-signing.md) or none."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up macOS signing
        if: steps.signing.outputs.enabled == 'true'
        uses: ./.github/actions/macos-signing-setup
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: List usable code-signing identities
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          # Diagnostic: the identity named by APPLE_SIGNING_IDENTITY must appear
          # here as valid, otherwise osx-sign cannot sign. The repo secret is
          # masked in logs, so a match shows as ***.
          security find-identity -v -p codesigning
          security find-identity -p codesigning | grep -c "CSSMERR" || true
      - name: Build (signed + notarized when configured, no publish)
        shell: bash
        env:
          # Bake the update feed's owner/repo from the repo this build runs in.
          # Without this, forge.config.ts falls back to DEFAULT_RELEASE_REPO,
          # which went stale across the AgentWrapper -> Untrivial-ai transfer and
          # left every published build pointing its updater at the old owner,
          # alive only through GitHub's rename redirect (#3523).
          AO_RELEASE_REPO: ${{ github.repository }}
        run: npm run make
      - name: Verify baked update feed repo
        # app-update.yml is what electron-updater reads at runtime to build the
        # feed URL; forge's prePackage hook writes it to the working dir and
        # ships it via extraResource. If the baked owner/repo ever diverges from
        # the repo publishing the release (org rename, fork misconfig), fail the
        # build here instead of stranding installed clients on a redirect
        # GitHub may some day stop honoring (#3523).
        shell: bash
        run: |
          set -euo pipefail
          owner="$(sed -n 's/^owner:[[:space:]]*//p' app-update.yml)"
          repo="$(sed -n 's/^repo:[[:space:]]*//p' app-update.yml)"
          echo "baked feed: $owner/$repo (expected $GITHUB_REPOSITORY)"
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::app-update.yml bakes $owner/$repo but this build publishes from $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - name: Verify macOS signature, Gatekeeper and notarization ticket
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECTED_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          zip="$(find out/make/zip/darwin -name '*.zip' | head -n1)"
          test -n "$zip" || { echo "::error::no mac zip found to verify"; exit 1; }
          work="$(mktemp -d)"
          # ditto, never unzip: unzip materializes AppleDouble entries and breaks the seal.
          ditto -x -k "$zip" "$work"
          app="$(find "$work" -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$app" || { echo "::error::no .app inside $zip"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          # Squirrel.Mac accepts an update only if its designated requirement
          # matches the running app's. Pin it to the Developer ID leaf + team so
          # every release signed by this team satisfies the previous one.
          details="$(codesign -dvv "$app" 2>&1)"
          echo "$details" | grep -E 'Authority=|TeamIdentifier='
          team="$(sed -n 's/.*(\([A-Z0-9]\{10\}\)).*/\1/p' <<<"$EXPECTED_IDENTITY" | head -n1)"
          if ! grep -q "^Authority=${EXPECTED_IDENTITY}\$" <<<"$details" || ! grep -q "^TeamIdentifier=${team}\$" <<<"$details"; then
            echo "::error::signed app does not carry the expected identity/team ($EXPECTED_IDENTITY)"
            exit 1
          fi
          codesign -d -r- "$app" 2>&1 | grep -E '^designated'
          echo "### macOS signing verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect artifact and compute digest
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist-artifact
          case "$PLATFORM" in
            darwin-*)
              # maker-zip output: out/make/zip/darwin/<arch>/<name>-<version>.zip
              src="$(find out/make/zip/darwin -name '*.zip' | head -n1)"
              name="agent-orchestrator-$PLATFORM.zip"
              ;;
            linux-x64)
              # AppImage (electron-builder) output: out/make/<productName>-<version>.AppImage
              src="$(find out/make -maxdepth 1 -name '*.AppImage' | head -n1)"
              name="agent-orchestrator-linux-x64.AppImage"
              ;;
            *)
              echo "unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          if [ -z "$src" ]; then echo "no build output found for $PLATFORM" >&2; exit 1; fi
          cp "$src" "dist-artifact/$name"
          hash="$(openssl dgst -sha256 "dist-artifact/$name" | awk '{print $NF}')"
          # Pinned digest contract: a flat filename -> sha256 hex map, merged
          # into one digests.json by the digests job below.
          jq -n --arg f "$name" --arg h "$hash" \
            '{($f): $h}' > "dist-artifact/$PLATFORM.digest.json"
          echo "$PLATFORM: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/dist-artifact/agent-orchestrator-${{ matrix.platform }}.*
          retention-days: 1
          if-no-files-found: error
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: frontend/dist-artifact/${{ matrix.platform }}.digest.json
          retention-days: 1
          if-no-files-found: error

  # Merge the per-platform digest fragments into one digests.json artifact so
  # a downstream consumer reads every expected hash from a single file.
  digests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Merge digests
        shell: bash
        run: |
          jq -s 'add' ./*.digest.json > digests.json
          { echo '### Artifact digests'; echo '```json'; cat digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: digests.json
          retention-days: 1
          if-no-files-found: error
