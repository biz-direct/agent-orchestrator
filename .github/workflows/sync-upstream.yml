# .github/workflows/sync-upstream.yml
name: Sync upstream

# FORK ONLY: bring OrchestratorInc/agent-orchestrator main into this fork's main
# through a reviewed PR. Never tags or publishes, never force-pushes.
#
#   clean merge  -> push sync/upstream-<sha> and open a PR into main.
#   conflicts    -> commit the raw merge (conflict markers included) to that branch,
#                   open a DRAFT PR, and dispatch Pullfrog to resolve the conflicts
#                   on it. The branch is a repeatable state: if Pullfrog times out,
#                   what it pushed is kept and a later run continues from it.
#   in flight    -> a PR for this upstream commit is already open; a draft whose
#                   Pullfrog run is gone is handed to Pullfrog again.
#
# Pullfrog reviews the PR once it is ready; sync-upstream-gate.yml merges it when
# the review is clean and CI is green, or opens an `agent-review` issue when a human is needed.
# Every run also re-evaluates all open sync PRs as a safety net.
#
# Needs the SYNC_PAT secret (PAT with repo + workflow scope): GITHUB_TOKEN
# cannot push changes to .github/workflows, and pushes made with it do not
# trigger CI on the sync PR. The Pullfrog dispatch uses GITHUB_TOKEN (actions: write).

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: OrchestratorInc/agent-orchestrator

jobs:
  sync:
    if: github.repository != 'OrchestratorInc/agent-orchestrator'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      # The job adds an `upstream` remote, which makes gh resolve the upstream
      # repo as its target; pin it to this fork.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require SYNC_PAT
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret SYNC_PAT (PAT with repo + workflow scope) is required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet upstream main
          sha="$(git rev-parse --short=12 upstream/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with $UPSTREAM@$sha"
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A PR for this upstream commit (from this repo, not an outside fork)
          # is already open: leave it to Pullfrog and the gate.
          open_pr="$(gh pr list --head "sync/upstream-$sha" --base main --state open \
            --json number,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | .number' | head -n1)"
          if [ -n "$open_pr" ]; then
            echo "Sync PR #$open_pr for $UPSTREAM@$sha is already open"
            echo "status=inflight" >> "$GITHUB_OUTPUT"
            echo "pr=$open_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "sync/upstream-$sha"
          if git merge --no-edit -m "Merge $UPSTREAM main ($sha) into fork" upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Keep the raw merge, markers included, as a commit on the branch.
            # Not every conflict leaves markers (modify/delete, binary, renames), so
            # record each path with its status code; the PR body carries the list.
            git status --porcelain | grep -E '^(DD|AU|UD|UA|DU|AA|UU) ' > "$RUNNER_TEMP/conflicts.txt" || true
            git add -A
            git commit --no-edit -m "Merge $UPSTREAM main ($sha) into fork (unresolved conflicts)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the sync PR
        id: pr
        if: steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          SHA: ${{ steps.merge.outputs.sha }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$SHA"
          # No force pushes: if the branch already exists (a rerun), reuse it.
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push origin "$branch"
          fi
          # Only trust a PR whose head lives in THIS repo and sits at the commit
          # we built; a same-named branch from an outside fork must not match.
          # Use the commit actually on origin (a rerun's local merge commit differs).
          remote_ref="refs/heads/$branch"
          head_sha="$(git ls-remote --heads origin "$remote_ref" |
            awk -F '\t' -v ref="$remote_ref" '$2 == ref { print $1 }')"
          pr="$(gh pr list --head "$branch" --base main --state open \
            --json number,headRefOid,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | select(.headRefOid == "'"$head_sha"'") | .number' | head -n1)"
          if [ -z "$pr" ]; then
            if [ "$STATUS" = conflict ]; then
              draft=(--draft)
              inventory="$(sed 's/^/    /' "$RUNNER_TEMP/conflicts.txt")"
              intro="Automated merge of \`$UPSTREAM\` main at \`$SHA\`. The merge conflicts; this branch holds the raw merge and Pullfrog is resolving it. Pullfrog marks the PR ready when every conflict is resolved; then it reviews the PR and sync-upstream-gate.yml merges it when the review is clean and CI is green, otherwise an \`agent-review\` issue is opened."
              legend="Git status codes (UU both modified, AA both added, DU/UD deleted by one side, AU/UA added by one side, DD both deleted) for every path that conflicted. Some of these have no conflict markers in the committed files, so resolve every path listed here, not just the files with markers."
              body="$(printf '%s\n\n## Conflict inventory\n\n%s\n\n%s\n' "$intro" "$legend" "$inventory")"
            else
              draft=()
              body="Automated merge of \`$UPSTREAM\` main at \`$SHA\`. Created by sync-upstream.yml. Pullfrog reviews it; sync-upstream-gate.yml merges it when the review is clean and CI is green, otherwise an \`agent-review\` issue is opened."
            fi
            pr="$(gh pr create --base main --head "$branch" "${draft[@]}" \
              --title "chore: sync upstream $UPSTREAM@$SHA" --body "$body" \
              | grep -oE '[0-9]+$')"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # Supersede older sync PRs.
          gh pr list --state open --base main --json number,headRefName,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | select(.headRefName | startswith("sync/upstream-")) | select(.headRefName != "'"$branch"'") | .number' |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by #$pr."
            done
          echo "Sync PR #$pr is open."
      - name: Hand conflicts to Pullfrog
        # A fresh conflicted merge, or an open draft sync PR that no Pullfrog run
        # is working on any more (timed out, failed): continue from the branch.
        if: steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'inflight'
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.merge.outputs.sha }}
          PR: ${{ steps.pr.outputs.pr || steps.merge.outputs.pr }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/conflicts.txt" ]; then
            { echo "### Upstream sync conflicts handed to Pullfrog (PR #$PR)"; sed 's/^/    /' "$RUNNER_TEMP/conflicts.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" != true ]; then
            echo "PR #$PR is ready for review; nothing for Pullfrog to resolve."
            exit 0
          fi
          active="$(gh run list --workflow pullfrog.yml --json status,displayTitle \
            --jq '[.[] | select((.status == "queued" or .status == "in_progress") and (.displayTitle | startswith("Sync upstream")))] | length')"
          if [ "$active" != 0 ]; then
            echo "Pullfrog is already working on a sync; leaving it."
            exit 0
          fi
          prompt="$(bash .github/scripts/sync-upstream-prompt.sh "$PR" "$SHA")"
          gh workflow run pullfrog.yml --ref main \
            -f name="Sync upstream $SHA" \
            -f prompt="$prompt"
          echo "Dispatched Pullfrog for PR #$PR ($UPSTREAM@$SHA)."
      - name: Flag a failed Pullfrog hand-off
        if: failure() && steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          bash .github/scripts/agent-review-issue.sh open \
            "Upstream sync needs review: hand-off to Pullfrog failed for $UPSTREAM@$SHA" \
            "Merging $UPSTREAM main ($SHA) into main conflicts and the Pullfrog dispatch failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Re-evaluate open sync PRs
        # Safety net: a missed event must not strand a sync PR, including one for
        # an older upstream commit.
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number' |
            while read -r pr; do
              bash .github/scripts/sync-upstream-gate.sh "$pr" || echo "::warning::Gate failed for #$pr"
            done
