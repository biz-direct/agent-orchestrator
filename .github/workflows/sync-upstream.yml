# .github/workflows/sync-upstream.yml
name: Sync upstream

# FORK ONLY: bring OrchestratorInc/agent-orchestrator main into this fork's main
# through a DRAFT PR that a human triages. Never tags or publishes, never force-pushes,
# never merges: the user merges after ticking the rejects (see docs/fork-ci.md).
#
#   clean merge  -> push sync/upstream-<sha> and open a DRAFT PR into main.
#   conflicts    -> commit the raw merge (conflict markers included) to that branch
#                   and open a DRAFT PR. The branch is a repeatable state: if Pullfrog
#                   times out, what it pushed is kept and a later run continues from it.
#   in flight    -> a sync PR is already open (any upstream commit); nothing new is
#                   opened, so triage work is never closed under the user. A draft whose
#                   Pullfrog pass never finished is handed to Pullfrog again.
#
# Either way one Pullfrog pass (sync-upstream-prompt.sh) resolves any conflicts and
# writes the triage list into the PR body. The PR stays a draft.
#
# Needs the SYNC_PAT secret (PAT with repo + workflow scope): GITHUB_TOKEN
# cannot push changes to .github/workflows, and pushes made with it do not
# trigger CI on the sync PR. The Pullfrog dispatch uses GITHUB_TOKEN (actions: write).

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: OrchestratorInc/agent-orchestrator

jobs:
  sync:
    if: github.repository != 'OrchestratorInc/agent-orchestrator'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      # The job adds an `upstream` remote, which makes gh resolve the upstream
      # repo as its target; pin it to this fork.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require SYNC_PAT
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret SYNC_PAT (PAT with repo + workflow scope) is required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet upstream main
          sha="$(git rev-parse --short=12 upstream/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with $UPSTREAM@$sha"
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A sync PR (from this repo, not an outside fork) is already open, for
          # this or an older upstream commit: leave it to the user. Opening a newer
          # one would close the PR being triaged and lose its worker commits.
          open_pr="$(gh pr list --base main --state open \
            --json number,headRefName,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | select(.headRefName | startswith("sync/upstream-")) | "\(.number) \(.headRefName)"' | head -n1)"
          if [ -n "$open_pr" ]; then
            pr_number="${open_pr%% *}"
            echo "Sync PR #$pr_number ($open_pr) is already open; not opening another."
            {
              echo "status=inflight"
              echo "pr=$pr_number"
              echo "sha=${open_pr##*sync/upstream-}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "sync/upstream-$sha"
          if git merge --no-edit -m "Merge $UPSTREAM main ($sha) into fork" upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Keep the raw merge, markers included, as a commit on the branch.
            # Not every conflict leaves markers (modify/delete, binary, renames), so
            # record each path with its status code; the PR body carries the list.
            git status --porcelain | grep -E '^(DD|AU|UD|UA|DU|AA|UU) ' > "$RUNNER_TEMP/conflicts.txt" || true
            git add -A
            git commit --no-edit -m "Merge $UPSTREAM main ($sha) into fork (unresolved conflicts)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the sync PR
        id: pr
        if: steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          SHA: ${{ steps.merge.outputs.sha }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$SHA"
          # No force pushes: if the branch already exists (a rerun), reuse it.
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push origin "$branch"
          fi
          # Only trust a PR whose head lives in THIS repo and sits at the commit
          # we built; a same-named branch from an outside fork must not match.
          # Use the commit actually on origin (a rerun's local merge commit differs).
          remote_ref="refs/heads/$branch"
          head_sha="$(git ls-remote --heads origin "$remote_ref" |
            awk -F '\t' -v ref="$remote_ref" '$2 == ref { print $1 }')"
          pr="$(gh pr list --head "$branch" --base main --state open \
            --json number,headRefOid,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | select(.headRefOid == "'"$head_sha"'") | .number' | head -n1)"
          if [ -z "$pr" ]; then
            marker='<!-- sync-triage:pending -->'
            if [ "$STATUS" = conflict ]; then
              inventory="$(sed 's/^/    /' "$RUNNER_TEMP/conflicts.txt")"
              intro="Automated merge of \`$UPSTREAM\` main at \`$SHA\`. The merge conflicts; this branch holds the raw merge and Pullfrog is resolving it, then writing the triage list below. This PR stays a draft and is never merged automatically."
              legend="Git status codes (UU both modified, AA both added, DU/UD deleted by one side, AU/UA added by one side, DD both deleted) for every path that conflicted. Some of these have no conflict markers in the committed files, so resolve every path listed here, not just the files with markers."
              body="$(printf '%s\n\n## Conflict inventory\n\n%s\n\n%s\n\n## Triage\n\n%s\n' "$intro" "$legend" "$inventory" "$marker")"
            else
              intro="Automated clean merge of \`$UPSTREAM\` main at \`$SHA\`. Pullfrog is writing the triage list below. This PR stays a draft and is never merged automatically."
              body="$(printf '%s\n\n## Triage\n\n%s\n' "$intro" "$marker")"
            fi
            pr="$(gh pr create --base main --head "$branch" --draft \
              --title "chore: sync upstream $UPSTREAM@$SHA" --body "$body" \
              | grep -oE '[0-9]+$')"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Sync PR #$pr is open."
      - name: Hand the sync to Pullfrog
        # One triage pass per sync: a fresh PR (clean or conflicted), or an open
        # draft sync PR whose pass never finished (timed out, failed): continue.
        if: steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'inflight'
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.merge.outputs.sha }}
          PR: ${{ steps.pr.outputs.pr || steps.merge.outputs.pr }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/conflicts.txt" ]; then
            { echo "### Upstream sync handed to Pullfrog (PR #$PR)"; sed 's/^/    /' "$RUNNER_TEMP/conflicts.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" != true ]; then
            echo "PR #$PR is no longer a draft; leaving it to the user."
            exit 0
          fi
          # Pullfrog replaces the pending marker once conflicts are resolved and the
          # triage list is written; a PR without it has no finished pass yet.
          if gh pr view "$PR" --json body --jq .body | grep -q 'sync-triage:done'; then
            echo "PR #$PR is already triaged; nothing for Pullfrog to do."
            exit 0
          fi
          active="$(gh run list --workflow pullfrog.yml --json status,displayTitle \
            --jq '[.[] | select((.status == "queued" or .status == "in_progress") and (.displayTitle | startswith("Sync upstream")))] | length')"
          if [ "$active" != 0 ]; then
            echo "Pullfrog is already working on a sync; leaving it."
            exit 0
          fi
          prompt="$(bash .github/scripts/sync-upstream-prompt.sh "$PR" "$SHA")"
          gh workflow run pullfrog.yml --ref main \
            -f name="Sync upstream $SHA" \
            -f prompt="$prompt"
          echo "Dispatched the Pullfrog triage pass for PR #$PR ($UPSTREAM@$SHA)."
      - name: Flag a failed Pullfrog hand-off
        if: failure() && steps.handoff.conclusion == 'failure'
        shell: bash
        env:
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          bash .github/scripts/agent-review-issue.sh open \
            "Upstream sync needs review: hand-off to Pullfrog failed for $UPSTREAM@$SHA" \
            "The Pullfrog dispatch for the $UPSTREAM main ($SHA) sync failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
