# .github/workflows/sync-upstream.yml
name: Sync upstream

# FORK ONLY: bring OrchestratorInc/agent-orchestrator main into this fork's main
# through a reviewed PR. Never tags or publishes, never force-pushes.
#
#   clean merge  -> push sync/upstream-<sha> and open a PR into main.
#   conflicts    -> dispatch Pullfrog to resolve them on that branch and open the PR.
#   in flight    -> a PR for this upstream commit is already open; leave it alone.
#
# Pullfrog reviews the PR; sync-upstream-gate.yml merges it when the review is
# clean and CI is green, or opens an `agent-review` issue when a human is needed.
# Every run also re-evaluates all open sync PRs as a safety net.
#
# Needs the SYNC_PAT secret (PAT with repo + workflow scope): GITHUB_TOKEN
# cannot push changes to .github/workflows, and pushes made with it do not
# trigger CI on the sync PR. The Pullfrog dispatch uses GITHUB_TOKEN (actions: write).

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: OrchestratorInc/agent-orchestrator

jobs:
  sync:
    if: github.repository != 'OrchestratorInc/agent-orchestrator'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - name: Require SYNC_PAT
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret SYNC_PAT (PAT with repo + workflow scope) is required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet upstream main
          sha="$(git rev-parse --short=12 upstream/main)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with $UPSTREAM@$sha"
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A PR for this upstream commit (from this repo, not an outside fork)
          # is already open: leave it to Pullfrog and the gate.
          open_pr="$(gh pr list --head "sync/upstream-$sha" --base main --state open \
            --json number,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | .number' | head -n1)"
          if [ -n "$open_pr" ]; then
            echo "Sync PR #$open_pr for $UPSTREAM@$sha is already open"
            echo "status=inflight" >> "$GITHUB_OUTPUT"
            echo "pr=$open_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "sync/upstream-$sha"
          if git merge --no-edit -m "Merge $UPSTREAM main ($sha) into fork" upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Record the conflicted paths before the merge is aborted.
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR for a clean merge
        if: steps.merge.outputs.status == 'clean'
        shell: bash
        env:
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$SHA"
          # No force pushes: if the branch already exists (a rerun), reuse it.
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push origin "$branch"
          fi
          # Only trust a PR whose head lives in THIS repo and sits at the commit
          # we built; a same-named branch from an outside fork must not match.
          # Use the commit actually on origin (a rerun's local merge commit differs).
          remote_ref="refs/heads/$branch"
          head_sha="$(git ls-remote --heads origin "$remote_ref" |
            awk -F '\t' -v ref="$remote_ref" '$2 == ref { print $1 }')"
          pr="$(gh pr list --head "$branch" --base main --state open \
            --json number,headRefOid,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | select(.headRefOid == "'"$head_sha"'") | .number' | head -n1)"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base main --head "$branch" \
              --title "chore: sync upstream $UPSTREAM@$SHA" \
              --body "Automated merge of \`$UPSTREAM\` main at \`$SHA\`. Created by sync-upstream.yml. Pullfrog reviews it; sync-upstream-gate.yml merges it when the review is clean and CI is green, otherwise an \`agent-review\` issue is opened." \
              | grep -oE '[0-9]+$')"
          fi
          # Supersede older sync PRs.
          gh pr list --state open --base main --json number,headRefName,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == "'"$GITHUB_REPOSITORY"'") | select(.headRefName | startswith("sync/upstream-")) | select(.headRefName != "'"$branch"'") | .number' |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by #$pr."
            done
          echo "Opened sync PR #$pr; waiting for Pullfrog and CI."
      - name: Hand conflicts to Pullfrog
        if: steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          files="$(sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt")"
          { echo "### Upstream sync conflicts handed to Pullfrog"; echo "$files"; } >> "$GITHUB_STEP_SUMMARY"
          prompt="$(cat <<EOF
          Sync this fork with upstream. Upstream is https://github.com/$UPSTREAM.git (branch main, commit $SHA).

          1. Fetch that URL's main, create the branch sync/upstream-$SHA from origin/main, and merge FETCH_HEAD into it.
          2. The merge conflicts in these files:
          $files
             Resolve every conflict. Keep this fork's own changes (fork CI workflows under .github/workflows, fork release and versioning) and keep upstream's intent for everything else. Regenerate generated files (sqlc output under backend/internal/storage/sqlite/gen, OpenAPI and API schema files) with the repository's generator commands instead of hand-merging them. Merge the i18n JSON files by keeping the union of keys. Follow AGENTS.md.
          3. Verify as far as the environment allows: go build and go vet for the backend, and the frontend typecheck. Note anything you could not run.
          4. Push the branch and open a pull request into main titled "chore: sync upstream $UPSTREAM@$SHA". Its description must list each conflicted file and how you resolved it, and anything you are unsure about. Close older open sync/upstream-* pull requests with a comment pointing to the new one. Do not merge the pull request.

          If a conflict cannot be resolved with confidence, still open the pull request and say exactly what needs a human.
          EOF
          )"
          gh workflow run pullfrog.yml --ref main \
            -f name="Sync upstream $SHA" \
            -f prompt="$prompt"
          echo "Dispatched Pullfrog for $UPSTREAM@$SHA."
      - name: Flag a failed Pullfrog hand-off
        if: failure() && steps.merge.outputs.status == 'conflict'
        shell: bash
        env:
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          bash .github/scripts/agent-review-issue.sh open \
            "Upstream sync needs review: hand-off to Pullfrog failed for $UPSTREAM@$SHA" \
            "Merging $UPSTREAM main ($SHA) into main conflicts and the Pullfrog dispatch failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Re-evaluate open sync PRs
        # Safety net: a missed event must not strand a sync PR, including one for
        # an older upstream commit.
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number' |
            while read -r pr; do
              bash .github/scripts/sync-upstream-gate.sh "$pr" || echo "::warning::Gate failed for #$pr"
            done
