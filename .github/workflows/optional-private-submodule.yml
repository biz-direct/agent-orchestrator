name: Optional private submodule

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "private/ao-cloud"
      - "test/submodule/**"
      - ".github/workflows/optional-private-submodule.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "private/ao-cloud"
      - "test/submodule/**"
      - ".github/workflows/optional-private-submodule.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unauthenticated-recursive-clone:
    # Fork: upstream private-submodule layout.
    if: github.repository == 'OrchestratorInc/agent-orchestrator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Verify recursive clone skips private repository
        run: ./test/submodule/optional-private-checkout.sh
